name: 设备或指标支持申请
description: 提供硬件与可核验的协议依据
body:
  - type: input
    id: device
    attributes:
      label: 型号与 VID/PID，或目标指标名称
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 硬件、原版版本与希望实现的行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 文档、协议依据或脱敏观测结果
      description: 请勿上传完整厂商程序、固件、私人素材或个人标识。
